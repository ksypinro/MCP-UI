<div class="wrap">
  <h1>Add a device</h1>
  <p class="sub">New devices start Off. You can switch it on once it has been added.</p>

  <label for="name">Device Name</label>
  <input id="name" type="text" maxlength="64" autocapitalize="words" autocomplete="off"
         spellcheck="false" placeholder="Bedroom Lamp">
  <p class="field-error" id="name-error" hidden></p>

  <div class="bar">
    <button class="act primary" id="submit" type="button">Add Device</button>
  </div>
  <p class="notice" id="status" hidden></p>
</div>
