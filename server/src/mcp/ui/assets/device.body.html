<div class="wrap">
  <h1 id="name">Device</h1>
  <p class="sub" id="state">Loading…</p>

  <div class="bar">
    <div class="sw-hit">
      <button class="sw" id="switch" type="button" role="switch" aria-checked="false" disabled></button>
    </div>
    <button class="act" id="refresh" type="button" disabled>Refresh</button>
  </div>

  <div class="detail" id="detail" hidden>
    <div><span class="k">Device ID</span><span class="v" id="id"></span></div>
    <div><span class="k">Last updated</span><span class="v" id="updated"></span></div>
  </div>

  <p class="notice" id="status" hidden></p>
</div>
